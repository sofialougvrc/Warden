[package]
name = "warden-drift-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "warden_drift_engine"
path = "src/lib.rs"

[[bin]]
name = "warden-drift-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
